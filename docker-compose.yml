networks:
  network:
    driver: bridge

volumes:
  postgres:
  redis:
  n8n:
  prometheus:

services:
  redis:
    image: redis:7.4
    command: redis-server --appendonly yes --appendfsync everysec --save "" --maxmemory-policy noeviction
    restart: unless-stopped
    networks:
      - network
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18
    restart: unless-stopped
    networks:
      - network
    volumes:
      - postgres:/var/lib/postgresql
    env_file:
      - envs/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/jaeger:latest
    restart: unless-stopped
    networks:
      - network

  n8n:
    image: n8nio/n8n:latest
    command: start
    restart: unless-stopped
    networks:
      - network
    volumes:
      - n8n:/home/node/.n8n
    env_file:
      - envs/.env
      - envs/ai-assistant.env
    environment:
      - N8N_DISABLE_PRODUCTION_MAIN_PROCESS=true
    depends_on:
      redis:
        condition: service_healthy      
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  n8n_webhook:
    image: n8nio/n8n:latest
    command: webhook
    restart: unless-stopped
    networks:
      - network
    volumes:
      - n8n:/home/node/.n8n
    env_file:
      - envs/.env
    depends_on:
      redis:
        condition: service_healthy      
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  n8n_worker:
    image: n8nio/n8n:latest
    command: worker --concurrency=10
    stop_grace_period: 60s
    restart: unless-stopped
    networks:
      - network
    volumes:
      - n8n:/home/node/.n8n
    env_file:
      - envs/.env
    depends_on:
      redis:
        condition: service_healthy      
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  n8n_task_runner:
    image: n8nio/runners:latest
    restart: unless-stopped
    networks:
      - network
    env_file:
      - envs/task-runner.env
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n_worker:5679
    depends_on:
      - n8n_worker

  searxng:
    image: ghcr.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - network
    env_file:
      - envs/searxng.env
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    restart: unless-stopped
    networks:
      - network
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus-settings.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    depends_on:
      - n8n

  cloudflare:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    networks:
      - network
    env_file:
      - envs/cloudflare.env
    depends_on:
      - n8n
      - n8n_webhook
      - jaeger
